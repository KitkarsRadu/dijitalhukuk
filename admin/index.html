<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CMS Yönetimi</title><link rel="stylesheet" href="../style.css"><script src="../main.js" defer></script><style>.admin{padding:42px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tabs button{border:1px solid #d7c8ba;border-radius:8px;padding:10px 14px;background:#fff}.tabs button.active{background:#181b20;color:#fff}.row{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid #e2e8f0}.row div{flex:1}.danger{color:#be123c;background:#fff;border:1px solid #fecdd3}.editor{display:none;padding:20px;background:#f8fafc;border-radius:12px}.editor.open{display:block}.editor input,.editor textarea{width:100%;margin:5px 0 12px;padding:9px;border:1px solid #cbd5e1;border-radius:6px}.langs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:650px){.langs{grid-template-columns:1fr}.row{align-items:flex-start;flex-wrap:wrap}}</style></head><body><main class="container admin"><p class="eyebrow">Dijital Hukuk CMS</p><h1 class="title">İçerik Yönetimi</h1><nav class="tabs"><button class="active" data-type="posts">Blog & Haberler</button><button data-type="faq">SSS Yönetimi</button><button data-type="practice">Uzmanlık Alanları</button><button data-type="guide">Konsolosluk Rehberi</button></nav><a id="postAdd" class="btn btn-gold" href="yazi-ekle.html">+ Yeni Yazı Ekle</a><button id="add" class="btn btn-gold" style="display:none">+ Yeni Kayıt</button><section class="editor" id="editor"><h2>Üç dilli içerik</h2><div class="langs"><div><b>TR</b><input name="tr_title" placeholder="Başlık"><textarea name="tr_text" placeholder="Açıklama / cevap"></textarea></div><div><b>DE</b><input name="de_title" placeholder="Titel"><textarea name="de_text" placeholder="Beschreibung / Antwort"></textarea></div><div><b>EN</b><input name="en_title" placeholder="Title"><textarea name="en_text" placeholder="Description / answer"></textarea></div></div><button id="save" class="btn btn-gold">Kaydet</button></section><div id="list"></div></main><script>document.addEventListener('DOMContentLoaded',()=>{if(!sessionStorage.getItem('dh-admin'))location='login.html';let type='posts',edit=-1;const defs={faq:defaultFaq,practice:defaultPractice,guide:defaultGuide},keys={faq:'dh-faq',practice:'dh-practice',guide:'dh-guide'},list=document.querySelector('#list'),ed=document.querySelector('#editor');const data=()=>type==='posts'?getPosts():cmsData(keys[type],defs[type]);function render(){document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x.dataset.type===type));document.querySelector('#postAdd').style.display=type==='posts'?'inline-flex':'none';document.querySelector('#add').style.display=type==='posts'?'none':'inline-flex';list.innerHTML=data().map((x,i)=>{let v=type==='practice'?x.tr:x.tr;return `<article class="row"><div><b>${v[0]}</b><br><small>${v[1]}</small></div>${type!=='posts'?`<button class="btn btn-light" data-edit="${i}">Düzenle</button><button class="btn danger" data-del="${i}">Sil</button>`:'<a class="btn btn-light" href="yazi-ekle.html?id='+x.id+'">Düzenle</a>'}</article>`}).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>open(Number(b.dataset.edit)));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let a=data();a.splice(Number(b.dataset.del),1);localStorage.setItem(keys[type],JSON.stringify(a));render()})}function open(i=-1){edit=i;ed.classList.add('open');let x=i>=0?data()[i]:null;['tr','de','en'].forEach(l=>{document.querySelector(`[name=${l}_title]`).value=x?.[l]?.[0]||'';document.querySelector(`[name=${l}_text]`).value=x?.[l]?.[1]||''})}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;ed.classList.remove('open');render()});document.querySelector('#add').onclick=()=>open();document.querySelector('#save').onclick=()=>{let x={tr:[tr_title.value,tr_text.value],de:[de_title.value,de_text.value],en:[en_title.value,en_text.value]};if(type==='practice')x.icon='fa-scale-balanced';let a=data();edit<0?a.push(x):a[edit]=x;localStorage.setItem(keys[type],JSON.stringify(a));ed.classList.remove('open');render()};render()})</script></body></html>
