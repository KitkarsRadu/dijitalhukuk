<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yazı Ekle</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css"><script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script><style>.editor{padding:42px 0;max-width:980px}.editor input,.editor select,.editor textarea{width:100%;margin:6px 0 18px;padding:11px;border:1px solid #cbd5e1;border-radius:7px}.translation-box{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:22px;margin:20px 0;background:#f8fafc;border-radius:12px}.translation-box h2{grid-column:1/-1;margin:0}@media(max-width:600px){.translation-box{grid-template-columns:1fr}}</style></head><body><main class="container editor"><a href="index.html">← Panele dön</a><h1 class="title">Yazı Ekle / Düzenle</h1><form id="post-form"><label>Türkçe Başlık<input name="title" required></label><label>Kategori<select name="category"><option>Miras & Tereke Hukuku</option><option>Gayrimenkul, Tapu & Tahliye</option><option>Boşanma, Velayet & Tanıma-Tenfiz</option><option>Göçmenlik, Vize & Aile Birleşimi</option><option>İcra & Alacak Tahsili</option><option>Şirketler & Ticaret Hukuku</option><option>Türk Ceza Hukuku Süreçleri</option><option>Konsolosluk & Noterlik İşlemleri</option></select></label><label>Görsel URL<input name="image" type="url"></label><label>veya Görsel Dosyası<input name="file" type="file" accept="image/*"></label><label>Türkçe kısa özet<textarea name="summary" rows="3"></textarea></label><button type="button" class="btn btn-light" id="translate">Almanca ve İngilizceye Otomatik Çevir</button><section class="translation-box"><h2>Çoklu dil varyantları</h2><div><label>Deutsch – Titel<input name="title_de"></label><label>Deutsch – Kurzfassung<textarea name="summary_de" rows="4"></textarea></label></div><div><label>English – Title<input name="title_en"></label><label>English – Summary<textarea name="summary_en" rows="4"></textarea></label></div></section><label>İçerik</label><div id="quill"></div><p><label><input type="checkbox" name="featured"> Ana sayfa kayan manşetinde göster</label></p><button class="btn btn-gold">Yayınla</button></form></main><script>if(!sessionStorage.getItem('dh-admin'))location='login.html';const f=document.querySelector('#post-form'),q=new Quill('#quill',{theme:'snow'}),id=Number(new URLSearchParams(location.search).get('id')),all=JSON.parse(localStorage.getItem('dh-posts')||'[]'),old=all.find(p=>p.id===id);if(old){['title','category','image','summary'].forEach(k=>f.elements[k].value=old[k]||'');['de','en'].forEach(l=>{f.elements['title_'+l].value=old.translations?.[l]?.title||'';f.elements['summary_'+l].value=old.translations?.[l]?.summary||''});f.elements.featured.checked=old.featured;q.root.innerHTML=old.content||''}async function t(text,to){const res=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=tr|'+to);const json=await res.json();if(!json.responseData?.translatedText)throw Error();return json.responseData.translatedText}document.querySelector('#translate').onclick=async()=>{const b=document.querySelector('#translate'),s=f.summary.value||q.getText().trim().slice(0,180);b.disabled=true;b.textContent='Çevriliyor…';try{const r=await Promise.all([t(f.title.value,'de'),t(f.title.value,'en'),t(s,'de'),t(s,'en')]);f.title_de.value=r[0];f.title_en.value=r[1];f.summary_de.value=r[2];f.summary_en.value=r[3]}catch{alert('Çeviri servisine ulaşılamadı. Lütfen tekrar deneyin.')}finally{b.disabled=false;b.textContent='Almanca ve İngilizceye Otomatik Çevir'}};f.onsubmit=e=>{e.preventDefault();const save=image=>{const title=f.title.value,summary=f.summary.value||q.getText().trim().slice(0,180),cat=f.category.value,data={id:id||Date.now(),title,summary,category:cat,key:cat.includes('Miras')?'miras':cat.includes('Gayrimenkul')?'tapu':cat.includes('Konsolosluk')?'konsolosluk':'tenfiz',image:image||f.image.value||'https://images.unsplash.com/photo-1450101499163-c8848c66ca85?auto=format&fit=crop&w=1200&q=80',content:q.root.innerHTML,date:new Date().toLocaleDateString('tr-TR'),read:'5 dk',featured:f.featured.checked,translations:{de:{title:f.title_de.value||title,summary:f.summary_de.value||summary},en:{title:f.title_en.value||title,summary:f.summary_en.value||summary}}};localStorage.setItem('dh-posts',JSON.stringify(id?all.map(p=>p.id===id?data:p):[data,...all]));location='index.html'};const file=f.file.files[0];if(file){const r=new FileReader;r.onload=()=>save(r.result);r.readAsDataURL(file)}else save()}</script></body></html>
