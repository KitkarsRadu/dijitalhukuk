<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim Girişi</title><link rel="stylesheet" href="../style.css"><style>body{display:grid;min-height:100vh;place-items:center;background:#0f172a}.login{width:min(420px,calc(100% - 32px));padding:38px;background:#fff;border-radius:16px}.login h1{font-family:Georgia,serif}.login input{width:100%;margin:7px 0 17px;padding:11px;border:1px solid #cbd5e1;border-radius:7px}.login .btn{width:100%}</style></head><body><main class="login"><p class="eyebrow">Dijital Hukuk</p><h1>Yönetim Paneli</h1><p>Yazı yönetimine güvenli demo girişi.</p><form id="login"><label>Kullanıcı adı<input required value="admin"></label><label>Şifre<input type="password" required value="hukuk2026"></label><button class="btn btn-gold">Giriş Yap</button><p id="msg"></p></form></main><script>document.querySelector('#login').onsubmit=e=>{e.preventDefault();let f=e.currentTarget;if(f.elements[0].value==='admin'&&f.elements[1].value==='hukuk2026'){sessionStorage.setItem('dh-admin','1');location='index.html'}else document.querySelector('#msg').textContent='Kullanıcı adı veya şifre hatalı.'}</script></body></html>
